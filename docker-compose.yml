services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgresouhnqf2iou34123fasdf
      POSTGRES_DB: ratunda
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5001:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - ENVIRONMENT=prod-kvm4
      - DATABASE_URL=postgres://postgres:postgre@ouhnqf2iou34123fasdf@db:5432/ratunda
    depends_on:
      - db
    restart: unless-stopped

volumes:
  pgdata:
