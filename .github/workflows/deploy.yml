name: Deploy to Server

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: prod-kvm4
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.DEPLOY_PORT }}" "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts
          cat >> ~/.ssh/config << EOF
          Host deploy
            HostName ${{ secrets.DEPLOY_HOST }}
            Port ${{ secrets.DEPLOY_PORT }}
            User ${{ secrets.DEPLOY_USER }}
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking no
          EOF

      # - name: Clone or pull repo on server
      #   run: |
      #     ssh -i ~/.ssh/deploy_key -p "${{ secrets.DEPLOY_PORT }}" "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
      #       "if [ -d /home/${{ secrets.DEPLOY_USER }}/ratunda-landingpage ]; then \
      #         cd /home/${{ secrets.DEPLOY_USER }}/ratunda-landingpage && chmod -R u+w .git/objects 2>/dev/null || true && git pull; \
      #       else \
      #         cd /home/${{ secrets.DEPLOY_USER }} && git clone git@github.com:${{ github.repository }}.git ratunda-landingpage; \
      #       fi"

      - name: Run docker-compose on server
        run: |
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.DEPLOY_PORT }}" "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "cd /home/${{ secrets.DEPLOY_USER }}/ratunda-landingpage && docker compose down && docker compose build --no-cache && docker compose up -d"
