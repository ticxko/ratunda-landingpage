name: Deploy to Server

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: prod-kvm4
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start ssh-agent
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Add server to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${{ secrets.DEPLOY_PORT }}" "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Clone or pull repo on server
        run: |
          ssh -p "${{ secrets.DEPLOY_PORT }}" "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "if [ -d /home/${{ secrets.DEPLOY_USER }}/ratunda-landingpage ]; then \
              cd /home/${{ secrets.DEPLOY_USER }}/ratunda-landingpage && git pull; \
            else \
              cd /home/${{ secrets.DEPLOY_USER }} && git clone git@github.com:${{ github.repository }}.git ratunda-landingpage; \
            fi"

      - name: Run docker-compose on server
        run: |
          ssh -p "${{ secrets.DEPLOY_PORT }}" "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "cd /home/${{ secrets.DEPLOY_USER }}/ratunda-landingpage && docker compose down && docker compose build --no-cache && docker compose up -d"
